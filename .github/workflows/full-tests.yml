name: Full available test suite

on:
  push:
    paths:
      - 'design/**'
      - 'pm/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '**/*.gd'
      - '**/*.tscn'
      - '**/*.tres'
      - '**/*.cs'
      - 'project.godot'
      - 'game/**'
      - 'src/**'
      - 'addons/**'
      - 'assets/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install 2D asset authoring test dependency
        run: python -m pip install Pillow==12.2.0
      - name: Validate all design data and links
        run: python tools/verify_design.py --scope all
      - name: Test validators against invalid designs
        run: python -m unittest discover -s tests -v

  game-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Verify runtime test coverage is configured
        run: python tools/check_runtime_tests.py
      - name: Verify isolated original-style 2D hero sample
        run: python tools/hero_2d/run_contract_tests.py
      - name: Verify isolated 2D hair bones and attachment contracts
        run: python tools/hero_2d/run_hair_review.py --contracts
      - name: Verify fixed-root 2D walk pixels and original limb registration
        run: python tools/walk_stability/run_audit.py --tag ci --test
      - name: Run native Godot startup and runtime tests
        run: python tools/run_game_tests.py
